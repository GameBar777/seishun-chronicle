<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>よくある質問 | 青春クロニクル ～君と過ごした1000日間～</title><link rel="icon" href="./icon.svg"><style>body{font-family:"Hiragino Sans","Noto Sans JP",system-ui,sans-serif;background:#fdf0f5;color:#2d3436;max-width:720px;margin:0 auto;padding:24px 18px 60px;line-height:1.85}h2{color:#e84393}a{color:#e84393}.ph{background:#fff3cd;padding:2px 6px}</style></head><body><p><a href="./">← ゲームに戻る</a></p><h1>よくある質問</h1><h2>声が出ません</h2><p>ブラウザ内蔵の読み上げ機能を使っています。日本語の音声が入っていない端末やブラウザでは文字のみになります。設定（⚙）から確認できます。</p><h2>会話はAIですか？</h2><p>いいえ。端末の中でキーワードを判定し、用意した台詞で返事をしています。外部にデータは送りません。</p><h2>セーブは？</h2><p>端末に自動で保存されます。SAVEで表示される文字列をコピーしておけば、別の端末でもLOADで再開できます。</p><h2>1周の長さは？</h2><p>2〜4時間が目安です（読むペースによります）。</p><hr><p style="font-size:.8rem"><a href="./about.html">このゲームについて</a>・<a href="./how-to-play.html">遊び方</a>・<a href="./faq.html">FAQ</a>・<a href="./changelog.html">更新履歴</a>・<a href="./privacy.html">プライバシーポリシー</a>・<a href="./terms.html">利用規約</a></p></body></html>
